[workspace]
resolver = "2"
members = [
    "crates/lrd-protocol",
    "crates/lrd-security",
    "crates/lrd-transport",
    "crates/lrd-discovery",
    "crates/lrd-storage",
    "crates/lrd-video",
    "crates/lrd-input",
    "crates/lrd-session",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
lrd-protocol = { path = "crates/lrd-protocol" }
lrd-security = { path = "crates/lrd-security" }
lrd-transport = { path = "crates/lrd-transport" }
lrd-discovery = { path = "crates/lrd-discovery" }
lrd-storage = { path = "crates/lrd-storage" }
lrd-video = { path = "crates/lrd-video" }
lrd-input = { path = "crates/lrd-input" }
lrd-session = { path = "crates/lrd-session" }

tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mdns-sd = "0.13"
if-addrs = "0.13"
gethostname = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.9"
openh264 = "0.9"
cpal = "0.16"
screencapturekit = "11"
enigo = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
core-graphics = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Mesmo em debug, compila as bibliotecas de imagem otimizadas (captura/JPEG ficam lentos sem isso).
[profile.dev.package."*"]
opt-level = 2

# Laços de comparação/redução de tiles: lentos demais sem otimização.
[profile.dev.package.lrd-video]
opt-level = 3
