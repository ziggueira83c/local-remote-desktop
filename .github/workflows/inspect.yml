name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        working-directory: tools/inspect
        run: cargo generate-lockfile && cargo fetch && grep -B1 -A1 -E '^name = "windows"' Cargo.lock; grep -A12 'name = "xcap"' Cargo.lock
      - name: dump
        run: |
          R=$(ls -d ~/.cargo/registry/src/*/ | head -1)
          ls $R | grep -E "^windows-0|^windows-core|^windows-sys|argon2|password-hash"
          W=$(ls -d ${R}windows-0.61* | sort -V | tail -1); echo "W=$W"
          MF=$W/src/Windows/Win32/Media/MediaFoundation/mod.rs
          for fn in MFStartup MFTEnumEx MFCreateMediaType MFCreateSample MFCreateMemoryBuffer MFShutdown; do grep -n "pub unsafe fn $fn" -A8 $MF | head -12; done
          grep -n "pub struct MFT_OUTPUT_DATA_BUFFER" -A8 $MF
          grep -n "pub struct MFT_REGISTER_TYPE_INFO" -A4 $MF
          grep -n "pub struct MFT_OUTPUT_STREAM_INFO" -A5 $MF
          grep -n "impl IMFTransform {" -A80 $MF | grep "pub unsafe fn" | head -40
          grep -n "impl IMFMediaEventGenerator {" -A30 $MF | grep "pub unsafe fn" | head
          grep -n "impl IMFMediaEvent {" -A30 $MF | grep "pub unsafe fn" | head
          grep -n "impl IMFAttributes {" -A120 $MF | grep "pub unsafe fn" | head -40
          grep -n "impl IMFActivate {" -A20 $MF | grep "pub unsafe fn" | head
          grep -n "impl IMFMediaBuffer {" -A20 $MF | grep "pub unsafe fn" | head
          grep -n "impl IMFSample {" -A60 $MF | grep "pub unsafe fn" | head -30
          grep -n "impl ICodecAPI {" -A60 $MF | grep "pub unsafe fn" | head -20
          grep -n "pub const \(METransformNeedInput\|METransformHaveOutput\|MF_TRANSFORM_ASYNC_UNLOCK\|MFT_ENUM_FLAG_HARDWARE\|MFT_CATEGORY_VIDEO_ENCODER\|MFVideoFormat_NV12\|MFVideoFormat_H264\|MF_MT_FRAME_SIZE\|MF_MT_MPEG_SEQUENCE_HEADER\|CODECAPI_AVLowLatencyMode\|CODECAPI_AVEncCommonMeanBitRate\|CODECAPI_AVEncVideoForceKeyFrame\|CODECAPI_AVEncCommonRateControlMode\|MF_VERSION\|MFSTARTUP_FULL\|MFT_MESSAGE_NOTIFY_START_OF_STREAM\|MF_E_TRANSFORM_NEED_MORE_INPUT\|MF_E_NOTACCEPTING\|MFSampleExtension_CleanPoint\|MFT_FRIENDLY_NAME_Attribute\|MF_MT_ALL_SAMPLES_INDEPENDENT\|eAVEncCommonRateControlMode_CBR\|MF_TRANSFORM_ASYNC\b\|MFT_ENUM_FLAG_SORTANDFILTER\|MF_MT_MPEG2_PROFILE\|eAVEncH264VProfile_Base\|MF_E_TRANSFORM_STREAM_CHANGE\|MFT_MESSAGE_SET_D3D_MANAGER\|CODECAPI_AVEncMPVGOPSize\|MFT_ENUM_FLAG_ASYNCMFT\)" $MF | head -40
          V=$W/src/Windows/Win32/System/Variant/mod.rs
          grep -n "pub struct VARIANT\b" -A3 $V | head
          C=$(ls -d ${R}windows-core-0.61* | sort -V | tail -1); echo "C=$C"
          grep -rn "impl From<bool> for VARIANT\|impl From<u32> for VARIANT\|impl From<i32> for VARIANT\|impl From<u64> for VARIANT" $C/src $W/src 2>/dev/null | head
          grep -rn "pub unsafe fn CoTaskMemFree" -A3 $W/src/Windows/Win32/System/Com/mod.rs | head -5
          A=$(ls -d ${R}argon2-* | sort -V | tail -1); grep -n "pub fn hash_password\|pub fn verify_password\|pub fn default" $A/src/*.rs | head
          ls ${R} | grep -E "^xcap" ; XC=$(ls -d ${R}xcap-0.9* | sort -V | tail -1); grep -A3 'windows' $XC/Cargo.toml | head -20
