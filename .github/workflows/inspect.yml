name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        working-directory: tools/inspect
        run: cargo generate-lockfile && cargo fetch && grep -A2 -E 'name = "(webrtc|opus|audiopus_sys|interceptor|rtcp|bytes|openh264-sys2)"' Cargo.lock | head -60
      - name: dump
        run: |
          R=$(ls -d ~/.cargo/registry/src/*/ | head -1)
          W=$(ls -d ${R}webrtc-0.1* | sort -V | tail -1)
          echo "WEBRTC DIR $W"
          ls $W/examples/examples 2>/dev/null | head -50; ls $W/examples | head
          for f in $(ls $W/examples/examples/play-from-disk-h264/*.rs $W/examples/examples/rtcp-processing/*.rs 2>/dev/null); do echo "################ $f"; grep -v "^\s*//" $f; done
          echo "################ registry"; grep -n "pub fn" -A12 $W/src/api/interceptor_registry/mod.rs | head -120
          grep -n "pub fn \|pub async fn " $W/src/api/media_engine/mod.rs | head -40
          grep -n "pub const MIME" $W/src/api/media_engine/mod.rs
          grep -n "pub fn \|pub async fn " $W/src/peer_connection/mod.rs | head -80
          grep -n "pub fn \|pub async fn " $W/src/track/track_local/track_local_static_sample.rs
          grep -n "pub fn \|pub async fn " $W/src/api/setting_engine/mod.rs | head -60
          M=$(ls -d ${R}webrtc-media-* | sort -V | tail -1); grep -n "pub struct Sample" -A22 $M/src/lib.rs
          RT=$(ls -d ${R}rtcp-* | sort -V | tail -1)
          grep -rn "pub struct\|    pub [a-z_]*:" $RT/src/payload_feedbacks/receiver_estimated_maximum_bitrate/mod.rs $RT/src/payload_feedbacks/picture_loss_indication/mod.rs $RT/src/receiver_report/mod.rs $RT/src/reception_report.rs | head -30
          O=$(ls -d ${R}opus-0.* | sort -V | tail -1)
          grep -n "pub fn \|pub enum\|^    [A-Z][a-zA-Z]*,\|^    [A-Z][a-zA-Z]* = " $O/src/lib.rs | head -70
          grep -A8 "^\[dependencies" $O/Cargo.toml
          A=$(ls -d ${R}audiopus_sys-* | sort -V | tail -1); echo "AUDIOPUS $A"
          sed -n '/\[features\]/,$p' $A/Cargo.toml | head -20
          grep -n "static\|cmake\|pkg_config\|LIBOPUS\|fn main" $A/build.rs | head -40
          S=$(ls -d ${R}openh264-sys2-0.9* | sort -V | tail -1)
          grep -rn "ENCODER_OPTION_BITRATE\|SPATIAL_LAYER_ALL\|pub type SBitrateInfo\|pub struct TagBitrateInfo" $S/src | head -10
          grep -rn "pub struct TagBitrateInfo" -A5 $S/src | head -8
          grep -n "^pub use\|^pub mod\|^mod " $S/src/lib.rs | head
