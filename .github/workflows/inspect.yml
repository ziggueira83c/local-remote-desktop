name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        working-directory: tools/inspect
        run: cargo generate-lockfile && cargo fetch && grep -A1 -E 'name = "(openh264|xcap|cpal|screencapturekit|objc2.*)"' Cargo.lock | head -60
      - name: dump
        run: |
          R=$(ls -d ~/.cargo/registry/src/*/ | head -1)
          show() { for f in $R$1; do echo "################ $f"; cat "$f"; done; }
          ls $R | grep -E "apple|screencapture|cpal|openh264"
          show "openh264-0.9*/src/formats/yuv.rs"
          show "openh264-0.9*/src/formats/rgb.rs" | grep -nE "pub fn new|impl.*for|pub struct" | head -40
          ls -R ${R}apple-cf-*/src | head -80
          show "apple-cf-*/src/cm/audio.rs"
          grep -rn "pub fn \|pub unsafe fn " ${R}apple-cf-*/src/cm/sample_buffer*.rs ${R}apple-cf-*/src/cv/*.rs | head -120
          grep -rn "pub fn " ${R}screencapturekit-11*/src/stream/configuration/*.rs | head -120
          grep -rn "pub fn " ${R}screencapturekit-11*/src/shareable_content/*.rs | head -60
          grep -rn "pub fn \|pub enum\|^    [A-Z0-9]*," ${R}screencapturekit-11*/src/stream/configuration/pixel_format.rs | head -40
          show "screencapturekit-11*/src/prelude.rs"
          show "screencapturekit-11*/Cargo.toml" | head -80
          grep -n "fn build_input_stream" -A12 ${R}cpal-0.16*/src/traits.rs
