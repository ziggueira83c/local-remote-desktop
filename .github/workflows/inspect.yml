name: inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        working-directory: tools/inspect
        run: cargo generate-lockfile && cargo fetch && grep -A1 -E '^name = "(webrtc|rtp|tauri-plugin-updater|apple-cf|screencapturekit)"' Cargo.lock
      - name: dump
        run: |
          R=$(ls -d ~/.cargo/registry/src/*/ | head -1)
          W=$(ls -d ${R}webrtc-0.17* | sort -V | tail -1)
          echo "######## track_local/mod.rs"; grep -v "^\s*//" $W/src/track/track_local/mod.rs | head -260
          echo "######## static_rtp"; grep -v "^\s*//" $W/src/track/track_local/track_local_static_rtp.rs | sed -n '1,330p'
